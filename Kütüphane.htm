<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Destek Kütüphanesi</title>
    <style>
        :root {
            --primary: #8e44ad;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        #search {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            outline: none;
        }
        /* Dropdown Stilleri */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background-color: #f8f9fa;
            color: #2c3e50;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .dropbtn:hover {
            background-color: #f1f3f5;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 220px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            border: 1px solid #e2e8f0;
        }
        .dropdown.active .dropdown-content {
            display: block;
        }
        .dropdown-content h4 {
            margin: 8px 0 4px 0;
            font-size: 11px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dropdown-content label {
            display: block;
            padding: 4px 0;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        .dropdown-content input[type="checkbox"] {
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <input id="search" type="search" placeholder="Sorularda veya cevaplarda ara (örn: depo, hata, yetki)...">
        
        <div class="dropdown">
            <button class="dropbtn"><span>🔍 Filtreler</span> <span>▼</span></button>
            <div class="dropdown-content" id="filterContainer">
                <h4>PROJE</h4>
                <label><input type="checkbox" class="proj-filter" value="Vestel"> Vestel </label>
                <label><input type="checkbox" class="proj-filter" value="Samsung"> Samsung </label>
                <label><input type="checkbox" class="proj-filter" value="Bsh"> Bsh </label>
                <label><input type="checkbox" class="proj-filter" value="Genel"> Genel</label>

                <h4>KATEGORİ</h4>
                <label><input type="checkbox" class="tag-filter" value="Payer"> Payer </label>
                <label><input type="checkbox" class="tag-filter" value="E2e"> E2e </label>
                <label><input type="checkbox" class="tag-filter" value="Ökc"> Ökc </label>
                <label><input type="checkbox" class="tag-filter" value="B.Transfer"> B.Transfer </label>
                <label><input type="checkbox" class="tag-filter" value="İnterpay"> İnterpay </label>
                <label><input type="checkbox" class="tag-filter" value="S.Online"> S.Online </label>
                <label><input type="checkbox" class="tag-filter" value="Ceva/Sub"> Ceva/Sub </label>
                <label><input type="checkbox" class="tag-filter" value="E-Devlet"> E-Devlet </label>
                <label><input type="checkbox" class="tag-filter" value="Ahb"> Ahb </label>
            </div>
        </div>
    </div>

    <div id="countDisplay" style="margin-bottom: 15px; font-size: 14px; color: #666;"></div>

    <!-- Soru Kartları Alanı -->
    <div id="cardContainer">
        <!-- Örnek Kart -->
        <div class="card" data-project="Genel" data-tags="Depo Tanımı">
            <div class="q-header" onclick="toggleCard(this)">S: Diva'da Depo Tanımlama kuralları nelerdir?</div>
            <div class="a-content" style="display:none;">
                <div class="a">Yeni depo tanımlama taleplerinde destek ekibi tarafından kurallar uygulanır.</div>
                <button class="btn-copy" onclick="copyValue(this)">Cevabı Kopyala</button>
            </div>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('search');
    const filterContainer = document.getElementById('filterContainer');
    const countDisplay = document.getElementById('countDisplay');

    function toggleCard(header) {
        const content = header.nextElementSibling;
        content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }

    function runFilters() {
        const query = searchInput.value.toLowerCase().trim();
        const selectedProj = Array.from(document.querySelectorAll('.proj-filter:checked')).map(cb => cb.value.toLowerCase());
        const selectedTags = Array.from(document.querySelectorAll('.tag-filter:checked')).map(cb => cb.value.toLowerCase());

        const cards = document.querySelectorAll('.card');
        let count = 0;

        cards.forEach(card => {
            const cardText = card.innerText.toLowerCase();
            const cardProj = (card.getAttribute('data-project') || "").toLowerCase();
            const cardTags = (card.getAttribute('data-tags') || "").toLowerCase();

            const searchMatch = cardText.includes(query);
            const projMatch = selectedProj.length === 0 || selectedProj.some(p => cardProj.includes(p));
            const tagMatch = selectedTags.length === 0 || selectedTags.some(t => cardTags.includes(t));

            if (searchMatch && projMatch && tagMatch) {
                card.style.display = "block";
                count++;
            } else {
                card.style.display = "none";
            }
        });
        if(countDisplay) countDisplay.innerText = `Toplam ${count} soru listeleniyor`;
    }

    function copyValue(btn) {
        const answerBox = btn.closest('.a-content').querySelector('.a');
        let text = answerBox.innerText.trim();

        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        const originalText = btn.innerText;
        btn.innerText = "✓ Kopyalandı!";
        setTimeout(() => { btn.innerText = originalText; }, 1500);
    }

    if(searchInput) searchInput.addEventListener('input', runFilters);
    if(filterContainer) filterContainer.addEventListener('change', runFilters);
    
    // Dropdown Açma/Kapatma Mantığı
    document.addEventListener("DOMContentLoaded", function() {
        const dropbtn = document.querySelector(".dropbtn");
        const dropdown = document.querySelector(".dropdown");

        if (dropbtn) {
            dropbtn.addEventListener("click", function(e) {
                e.stopPropagation();
                dropdown.classList.toggle("active");
            });
        }

        document.addEventListener("click", function() {
            if (dropdown) dropdown.classList.remove("active");
        });

        if (dropdown) {
            dropdown.addEventListener("click", function(e) {
                e.stopPropagation();
            });
        }
        runFilters();
    });
</script>

</body>
</html>
